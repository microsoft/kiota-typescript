
name: Build and test all the Kiota packages
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm ci
    - run: npm run build
    - run: npm run lint:eslint:loud
    - run: npm run prettier:check
    - name: Archive dist folders # archive dist folders to verify if they are transpiled correctly and available for publishing
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist folders ${{ matrix.node-version }}
        path: |
          packages/abstractions/dist
          packages/serialization/form/dist
          packages/serialization/json/dist
          packages/serialization/multipart/dist
          packages/serialization/text/dist
          packages/http/fetch/dist
          packages/authentication/azure/dist
          packages/authentication/msal-browser/dist
    - run: npm run build:integrated
    - run: npm run test

  code-coverage:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        coverage:
          - name: "Abstractions"
            path: "./packages/abstractions/coverage"
          - name: "Authentication Azure"
            path: "./packages/authentication/azure/coverage"
          - name: "Authentication MSAL Browser"
            path: "./packages/authentication/msal-browser/coverage"
          - name: "Authentication Spfx"
            path: "./packages/authentication/spfx/coverage"
          - name: "Http Fetch"
            path: "./packages/http/fetch/coverage"
          - name: "Serialization Form"
            path: "./packages/serialization/form/coverage"
          - name: "Serialization JSON"
            path: "./packages/serialization/json/coverage"
          - name: "Serialization Text"
            path: "./packages/serialization/text/coverage"
          - name: "Serialization Multipart"
            path: "./packages/serialization/multipart/coverage"
          - name: "Bundle"
            path: "./packages/bundle/coverage"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Use Node.js 26.x
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 26.x
    - run: npm ci
    - run: npm run build
    - run: npm run test:coverage
    - name: Code Coverage Report ${{ matrix.coverage.name }}
      uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
      with:
        filename: ${{ matrix.coverage.path }}/cobertura-coverage.xml
        format: markdown
        hide_branch_rate: false
        output: both
        badge: true
    - name: Archive coverage files
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: Coverage files for ${{ matrix.coverage.name }}
        path: ${{ matrix.coverage.path }}

  msal-browser:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm ci
    - run: npm run build
    - name: Install isolated browser test tools
      shell: bash
      run: |
        npm install --prefix "$RUNNER_TEMP/kiota-browser-tools" --no-save @vitest/browser-playwright@5.0.3
        node "$RUNNER_TEMP/kiota-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
    - name: Configure HTTPS browser tests
      shell: bash
      run: |
        openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/kiota-test-key.pem" -out "$RUNNER_TEMP/kiota-test-cert.pem" -days 1 -subj /CN=localhost -addext subjectAltName=DNS:localhost
        echo "KIOTA_TEST_TLS_KEY=$RUNNER_TEMP/kiota-test-key.pem" >> "$GITHUB_ENV"
        echo "KIOTA_TEST_TLS_CERT=$RUNNER_TEMP/kiota-test-cert.pem" >> "$GITHUB_ENV"
        cat > packages/authentication/msal-browser/.ci-browser.config.mts <<'CONFIG'
        import { mergeConfig, defineConfig } from "vitest/config";
        import { pathToFileURL } from "node:url";
        import base from "./vitest.config.mts";
        const { playwright } = await import(pathToFileURL(`${process.env.RUNNER_TEMP}/kiota-browser-tools/node_modules/@vitest/browser-playwright/dist/index.js`).href);
        export default mergeConfig(base, defineConfig({
          test: { browser: { enabled: true, provider: playwright(), headless: true, instances: [{ browser: "chromium" }] } }
        }));
        CONFIG
    - name: Run MSAL tests in actual Chromium over HTTPS
      run: npm exec --workspace @microsoft/kiota-authentication-msal-browser -- vitest run --config .ci-browser.config.mts

  # The check-typescript-version-matrix returns success if all matrix jobs in build are successful; otherwise, it returns a failure.
  # Use this as a PR status check for GitHub Policy Service instead of individual matrix entry checks.
  check-typescript-version-matrix:
    runs-on: ubuntu-latest
    needs: [build,code-coverage,msal-browser]
    if: always()
    steps:
      - name: All build matrix options are successful
        if: ${{ needs.build.result == 'success' && needs.code-coverage.result == 'success' && needs.msal-browser.result == 'success' }}
        run: exit 0
      - name: One or more build matrix options failed
        if: ${{ needs.build.result != 'success' || needs.code-coverage.result != 'success' || needs.msal-browser.result != 'success' }}
        run: exit 1
